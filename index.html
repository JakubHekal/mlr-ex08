<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leaf Classifier</title>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.19.2/dist/ort.min.js"></script>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 0 auto; padding: 16px; background: #f4f7f2; color: #1c2b1c; }
  h1 { font-size: 1.5rem; margin-bottom: 4px; }
  h2 { font-size: 1.1rem; margin-top: 24px; }
  video { width: 100%; max-width: 480px; border-radius: 10px; background: #000; display: block; margin: 12px 0; }
  #preview { width: 100%; max-width: 480px; border-radius: 10px; display: none; margin: 12px 0; }
  canvas { display: none; }
  button, label.upload { display: inline-block; padding: 10px 18px; margin: 4px 8px 4px 0; font-size: 1rem; border: none; border-radius: 8px; background: #2e7d32; color: #fff; cursor: pointer; }
  label.upload { background: #456990; }
  #status { font-weight: 600; }
  .row { margin: 10px 0; }
  .row .top { display: flex; justify-content: space-between; margin-bottom: 2px; }
  .pct { font-variant-numeric: tabular-nums; }
  .bar { height: 14px; background: #dde5dd; border-radius: 4px; overflow: hidden; }
  .fill { height: 100%; width: 0; background: #4caf50; transition: width .15s; }
  #qr-section { margin-top: 40px; text-align: center; }
  #qr-section img { width: 220px; height: 220px; }
  #qr-section p { word-break: break-all; }
</style>
</head>
<body>
<h1>Leaf Classifier</h1>
<p id="status">Loading model…</p>
<video id="video" playsinline muted autoplay></video>
<img id="preview" alt="Uploaded photo">
<div>
  <button id="startBtn">Start camera</button>
  <label class="upload">Upload photo<input type="file" id="fileInput" accept="image/*" hidden></label>
</div>
<canvas id="canvas" width="96" height="96"></canvas>
<h2>Probabilities</h2>
<div id="results"></div>
<section id="qr-section">
  <h2>Open this page on your phone</h2>
  <p>Scan this QR code to open this page on a phone:</p>
  <img id="qr-img" alt="QR code that opens https://jakubhekal.github.io/mlr-ex08/ on a phone" width="220" height="220" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAXIAAAFyAQAAAADAX2ykAAACxUlEQVR4nO1bQY6rMAy1DdJfgvQP0KOkNxvNkf4NyI3IshLIIzuBtowU0sXvkMFvkTbkLSxebcdxigyvwNNLdADj50E761sYPw/aWd/C+HnQzvoWxs+Ddta3MP4Z3g8mtIDXIIM8u4YWAMKydj2w/eWgk/Hb+OEGGcNfYN838REDTPLZ6Aj4HnvI+P9DXwg9gPsHgG7skX1SE3R3javI9v5r1XcB+14E7caoKormR7afjP+SvgqG0E4gIjMEeIK9zzzooPp2EomDxGeOATmKjOK/fGD7yfgl78frFrmXr7JrdqPsn0Exx+3zM78YZPwD+C+vc/aXKUblNDx5r+lV5+8Z11pX/Td5cjeJE8/pmdW/9erLn72E4csE+DHOyEN3w7u0AN3N4nOd+gIL4lfJusw8LcMIwAM0stowOCEOR7OfjF+irxNBh05OMTqRu0vPQDUfOmWZvrXqy+qmoiW4URxWlHbLdPkJmL7V8h1LhhWv9f2MUVp/0UNJScJxeKM9xaBy6pn5vhevjXspZv7ENuZf8BfNzpqE32hPMaiceur8O2pUTlk2Tp3m3zU0W/6t+HzDXyQ+hyUKpyZhwyiNpdhEii3Eo9lPxs+DEx73zyxS6jQWSRqpbX9Vdf3bMLPsldVLNTQr1sBt+tbuv3CveqU+UrnvOdny7y/wXxCk+vfhYGud2vlVpefPfPffJeHGJoPunyH8Yesv/Ir7kyD3c8DLNzeu7eA1HR/U/nLQOflOo2903RnxQ1NvkHah7qnfbk8xqJx6an5YbjhH/9X+73Kx42F6WPtLQWfnu9g1mlHPn7V1lA4uf8aeHdAe4eT8djPH5ZJOywCz3JTV2+/WX6i9/8vL+UZMuNoubLYH01Yf1X5/EuUmVqqEO62ZbqhnWlYfVakv2v+7q9KLjJ8F5Ze/wfh50M76FsbPg3bWtzB+HrW/ny9dWqhangG8qQAAAABJRU5ErkJggg==">
  <p>Or tap: <a id="qr-link" href="https://jakubhekal.github.io/mlr-ex08/">https://jakubhekal.github.io/mlr-ex08/</a></p>
</section>
<script>
const CLASSES = ["apple", "cherry", "chestnut", "maple"];
const SIZE = 96;
const MEAN = [0.485, 0.456, 0.406];
const STD = [0.229, 0.224, 0.225];

const statusEl = document.getElementById('status');
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const resultsEl = document.getElementById('results');

// One row per class, updated in place.
const rows = CLASSES.map(name => {
  const row = document.createElement('div');
  row.className = 'row';
  row.innerHTML = '<div class="top"><span>' + name + '</span><span class="pct">–</span></div><div class="bar"><div class="fill"></div></div>';
  resultsEl.appendChild(row);
  return { pct: row.querySelector('.pct'), fill: row.querySelector('.fill') };
});

ort.env.wasm.wasmPaths = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.19.2/dist/';
ort.env.wasm.numThreads = 1; // no SharedArrayBuffer without COOP/COEP (e.g. iOS Safari on GitHub Pages)

let session = null;
let busy = false;
let cameraTimer = null;

(async () => {
  try {
    session = await ort.InferenceSession.create('leaf_model.onnx', { executionProviders: ['wasm'] });
    statusEl.textContent = 'Model loaded. Start the camera or upload a photo.';
  } catch (e) {
    statusEl.textContent = 'Model failed to load: ' + e.message;
  }
})();

document.getElementById('startBtn').addEventListener('click', async () => {
  try {
    document.getElementById('preview').style.display = 'none'; // camera view replaces the photo preview
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
    video.srcObject = stream;
    await video.play();
    if (cameraTimer) clearInterval(cameraTimer);
    cameraTimer = setInterval(classifyVideo, 400);
    statusEl.textContent = 'Camera active — point at a leaf.';
  } catch (e) {
    statusEl.textContent = 'Camera unavailable: ' + e.message + ' — use photo upload instead.';
  }
});

document.getElementById('fileInput').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  if (cameraTimer) { clearInterval(cameraTimer); cameraTimer = null; } // photo result would be overwritten by the camera loop
  const preview = document.getElementById('preview');
  const img = new Image();
  img.onload = () => runInference(img, img.naturalWidth, img.naturalHeight);
  img.src = URL.createObjectURL(file);
  preview.src = img.src;
  preview.style.display = 'block';
});

});

function classifyVideo() {
  if (!session || busy || video.readyState < 2) return;
  runInference(video, video.videoWidth, video.videoHeight);
}

async function runInference(source, w, h) {
  if (!session || busy || !w || !h) return;
  busy = true;
  try {
    // Central square crop, resized to SIZE x SIZE.
    const side = Math.min(w, h);
    ctx.drawImage(source, (w - side) / 2, (h - side) / 2, side, side, 0, 0, SIZE, SIZE);
    const d = ctx.getImageData(0, 0, SIZE, SIZE).data;
    // Scale to 0–1 and standardize per channel, planar RGB: 1x3xSIZExSIZE.
    const data = new Float32Array(3 * SIZE * SIZE);
    for (let c = 0; c < 3; c++) {
      const mean = MEAN[c], std = STD[c];
      for (let i = 0; i < SIZE * SIZE; i++) {
        data[c * SIZE * SIZE + i] = (d[i * 4 + c] / 255 - mean) / std;
      }
    }
    const tensor = new ort.Tensor('float32', data, [1, 3, SIZE, SIZE]);
    const feeds = {};
    feeds[session.inputNames[0]] = tensor;
    const results = await session.run(feeds);
    const raw = Array.from(results[session.outputNames[0]].data);
    const probs = toProbabilities(raw);
    rows.forEach((r, i) => {
      r.pct.textContent = (probs[i] * 100).toFixed(2) + '%';
      r.fill.style.width = (probs[i] * 100).toFixed(2) + '%';
    });
  } catch (e) {
    statusEl.textContent = 'Inference failed: ' + e.message;
  } finally {
    busy = false;
  }
}

// The model may output probabilities directly or logits; handle both.
function toProbabilities(raw) {
  const sum = raw.reduce((a, b) => a + b, 0);
  if (Math.abs(sum - 1) < 1e-3 && raw.every(v => v >= 0 && v <= 1)) return raw;
  const m = Math.max(...raw);
  const e = raw.map(v => Math.exp(v - m));
  const s = e.reduce((a, b) => a + b, 0);
  return e.map(v => v / s);
}
</script>
</body>
</html>
